{% extends "base.html" %}{% block title %}Promotion{% endblock %}{% block page_title %}Student Promotion{% endblock %}
{% block content %}<div class="page-head"><div><h1>Student Promotion</h1><p>Promote multiple students to a new class</p></div><button class="btn primary" onclick="promote()">Promote Selected</button></div>
<section class="card"><div class="toolbar"><select id="toClass"><option value="">Destination Class</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select><input id="q" class="search" placeholder="Search students..."></div><div class="table-wrap"><table><thead><tr><th></th><th>ADM NO</th><th>STUDENT</th><th>CURRENT CLASS</th><th>SECTION</th></tr></thead><tbody id="rows"></tbody></table></div></section>{% endblock %}
{% block scripts %}<script>let d=[];async function load(){d=await api('/api/students');render()}function render(){let q=document.getElementById('q').value.toLowerCase();let a=d.filter(x=>`${x.full_name} ${x.adm_no} ${x.class_name}`.toLowerCase().includes(q));document.getElementById('rows').innerHTML=a.map(x=>`<tr><td><input type="checkbox" class="pick" value="${x.id}"></td><td>${esc(x.adm_no)}</td><td><b>${esc(x.full_name)}</b></td><td>${esc(x.class_name)}</td><td>${esc(x.section)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No students.</td></tr>'}async function promote(){let ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value),to_class=document.getElementById('toClass').value;if(!ids.length||!to_class){alert('Select students and destination class');return}await api('/api/promote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,to_class})});alert(ids.length+' student(s) promoted.');load()}document.getElementById('q').addEventListener('input',render);load();</script>{% endblock %}
